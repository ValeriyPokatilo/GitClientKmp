
# Dev

.dev_only: &dev_only
  - /^build/ios/dev/[0-9]*$/
  - /^build/dev/[0-9]*$/

build ios dev:
  extends: .build_ios_mpp
  environment: dev/ios
  variables:
    MATCH_APP_IDENTIFIERS: $IOS_BUNDLEID_DEV
    FIREBASE_BUNDLEID: $IOS_BUNDLEID_DEV
    BUILD_SCHEME: $IOS_SCHEME_DEV
  except:
    - branches
  only:
    *dev_only

deploy ios dev to firebase:
  extends: .deploy_ios_firebase
  environment: dev/ios/firebase
  variables:
    MATCH_APP_IDENTIFIERS: $IOS_BUNDLEID_DEV
    BUILD_SCHEME: $IOS_SCHEME_DEV
    BUILD_EXPORT_METHOD: 'enterprise'
    FIREBASE_APP_ID: $FIREBASE_APP_ID_IOS_DEV
  except:
    - branches
  needs:
    - build ios dev
  only:
    *dev_only

deploy ios dev to gitlab:
  extends: .deploy_ios_gitlab
  environment: dev/ios/gitlab
  variables:
    MATCH_APP_IDENTIFIERS: $IOS_BUNDLEID_DEV
    BUILD_SCHEME: $IOS_SCHEME_DEV
    BUILD_EXPORT_METHOD: 'enterprise'
  except:
    - branches
  needs:
    - build ios dev
  only:
    *dev_only

