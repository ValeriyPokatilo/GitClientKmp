# AppStore

.appstore_only: &appstore_only
  - /^build/ios/appstore/[0-9]*$/

build ios prod appstore:
  extends: .build_ios_mpp
  environment: appstore/ios
  variables:
    MATCH_APP_IDENTIFIERS: $IOS_BUNDLEID_PROD
    FIREBASE_BUNDLEID: $IOS_BUNDLEID_PROD
    BUILD_SCHEME: $IOS_SCHEME_PROD
    IS_APPSTORE: "true"
  except:
    - branches
  only:
    *appstore_only

deploy ios prod to appstore:
  extends: .deploy_ios_appstore
  environment: appstore/ios
  variables:
    MATCH_APP_IDENTIFIERS: $IOS_BUNDLEID_PROD
    BUILD_SCHEME: $IOS_SCHEME_PROD
    BUILD_EXPORT_METHOD: 'app-store'
  when: manual
  except:
    - branches
  needs:
    - build ios prod appstore
  only:
    *appstore_only
